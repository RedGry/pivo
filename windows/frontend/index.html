<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PivO</title>
  </head>
  <body>
    <main class="panel" data-i18n-aria="panel.companion" aria-label="PivO companion">
      <div class="character" aria-hidden="true">
        <div class="mascot"><img alt="" draggable="false" /></div>
        <div class="reminder"><img alt="" draggable="false" /></div>
        <div class="eyes"><span class="gaze"><i></i><i></i></span></div>
      </div>
      <div class="strip-status" aria-hidden="true">
        <svg class="status-ring" viewBox="0 0 20 20" fill="none"><path class="ring-track" d="M10 2.5a7.5 7.5 0 1 1 0 15a7.5 7.5 0 1 1 0-15Z"/><path class="ring-progress" d="M10 2.5a7.5 7.5 0 1 1 0 15a7.5 7.5 0 1 1 0-15Z" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
        <time class="clock"></time>
      </div>
      <header class="panel-header" data-i18n-aria="panel.clock" aria-label="Clock">
        <div class="header-status">
          <svg class="status-ring" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path class="ring-track" d="M10 2.5a7.5 7.5 0 1 1 0 15a7.5 7.5 0 1 1 0-15Z"/><path class="ring-progress" d="M10 2.5a7.5 7.5 0 1 1 0 15a7.5 7.5 0 1 1 0-15Z" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
          <time class="header-date"></time><time class="clock"></time>
        </div>
        <span class="settings control" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9.5 3-.7 2.2-2 .9L4.6 5.6 2.8 8.7l1.6 1.7v2.3l-1.6 1.7 1.8 3.1 2.2-.5 2 .9.7 2.1h3.6l.7-2.1 2-.9 2.2.5 1.8-3.1-1.6-1.7v-2.3l1.6-1.7L18 5.6l-2.2.5-2-.9-.7-2.2Z"/><circle cx="11.3" cy="11.5" r="3"/></svg></span>
        <span class="exit control" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m7 7 10 10m0-10L7 17"/></svg></span>
      </header>
      <section class="plugin-island"></section>
      <section class="content">
        <section class="updates" aria-live="polite" hidden>
          <div class="update-message"></div>
          <div class="update-notes"></div>
        </section>
      </section>
      <div class="update-actions" aria-hidden="true" hidden><span data-i18n="controls.update">Update</span><span data-i18n="controls.later">Later</span></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
