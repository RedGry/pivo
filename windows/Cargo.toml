[package]
name = "pivo-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pivo"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
base64 = "0.23.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
windows = { version = '0.62.2', features = ['Media_Control', 'Foundation', 'Storage_Streams', 'Win32_System_WinRT', 'Networking_Connectivity', 'Win32_Media_Audio_Endpoints', 'Win32_System_Threading', 'Win32_System_Diagnostics_ToolHelp', 'Win32_Storage_Packaging_Appx', 'Win32_System_Com', 'Win32_System_Com_StructuredStorage', 'Win32_System_Variant', 'Win32_Devices_Display', 'Win32_Graphics_Gdi', 'Win32_System_Ole', 'Win32_System_SystemServices', 'Win32_UI_Shell'] }
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Power", "Win32_Globalization", "Win32_Devices_Bluetooth", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

